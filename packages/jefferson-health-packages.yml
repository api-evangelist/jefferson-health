description: >-
  Jefferson Health publishes no first-party client libraries. This is the
  expected shape for a CMS-mandated provider FHIR surface: integrators use a
  generic FHIR/SMART client (Epic's own SMART tutorials, HAPI FHIR, fhirclient)
  rather than a health-system-branded SDK. Recorded as an explicit zero so the
  absence is data rather than an untried gap.

