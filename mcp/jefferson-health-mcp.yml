auth_note: >-
  If a server were built over these endpoints, the two halves would need
  different auth: the Provider Directory is anonymous, while every clinical tool
  requires a patient-authorized SMART on FHIR token, which means a per-user
  OAuth flow rather than a service credential. An MCP server fronting the
  clinical side is a consent surface, not a data surface.

