        required: false
        schema:
          type: string
      - name: practitioner
        in: query
        description: Practitioner that is able to provide the defined services for the organization
        required: false
        schema:
          type: string
      - name: service
        in: query
        description: The list of healthcare services that this worker provides for this role's Organization/Location(s)
        required: false
        schema:
          type: string
      - name: organization
        in: query
        description: The identity of the organization the practitioner represents / acts on behalf of
        required: false
        schema:
          type: string
      - name: location
        in: query
        description: One of the locations at which this practitioner provides care
        required: false
        schema:
          type: string
      - name: _id
        in: query
        description: The ID of the resource
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
