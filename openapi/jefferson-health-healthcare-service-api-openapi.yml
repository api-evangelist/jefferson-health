paths:
  /HealthcareService:
    get:
      tags:
      - Healthcare Service
      summary: 'search-type: Search for HealthcareService instances'
      description: This is a search type
      parameters:
      - name: specialty
        in: query
        description: The specialty of the service provided by this healthcare service
        required: false
        schema:
          type: string
      - name: service-category
        in: query
        description: Service Category of the Healthcare Service
        required: false
        schema:
          type: string
      - name: _lastUpdated
        in: query
        description: Only return resources which were last updated as specified by the given range
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: string
            format: date
      - name: coverage-area
        in: query
        description: Location(s) service is intended for/available to
        required: false
        schema:
          type: string
      - name: service-type
        in: query
        description: The type of service provided by this healthcare service
        required: false
        schema:
          type: string
      - name: organization
        in: query
        description: The organization that provides this Healthcare Service
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: A portion of the Healthcare service name
        required: false
        schema:
          type: string
      - name: location
        in: query
        description: The location of the Healthcare Service
        required: false
        schema:
          type: string
      - name: _id
        in: query
        description: The ID of the resource
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FHIR-JSON-RESOURCE'
            application/fhir+xml:
              schema:
                $ref: '#/components/schemas/FHIR-XML-RESOURCE'
      operationId: getHealthcareService
      x-operation-id-source: derived
