apis:
- aid: jefferson-health:tjuh-fhir-dstu2-api
  name: Thomas Jefferson University Hospital FHIR DSTU2 API
  tags:
  - DSTU2
  - Epic
  - FHIR
  - Legacy
  - SMART on FHIR
  humanURL: https://fhir.jefferson.edu/FHIRProxy/api/FHIR/DSTU2/
  baseURL: https://fhir.jefferson.edu/FHIRProxy/api/FHIR/DSTU2
  description: >-
    The legacy Thomas Jefferson University Hospital DSTU2 FHIR endpoint listed in Epic's public R4 endpoint
    registry under the organization "Jefferson Health". It remains available for backward compatibility
    with older SMART on FHIR apps written against the FHIR DSTU2 baseline that pre-dates the CMS Interoperability
    and Patient Access mandate; new integrations should target the R4 endpoint instead.
  properties:
  - type: Documentation
    url: https://fhir.epic.com/Specifications
  - type: EndpointDirectory
    url: https://open.epic.com/MyApps/EndpointsJson
- aid: jefferson-health:jhp-patient-access-fhir-api
  name: Jefferson Health Plans Patient Access FHIR API
  tags:
  - CARIN Blue Button
  - CMS Interoperability
  - FHIR
  - Patient Access
  - Payer
  - R4
  - SMART on FHIR
  - Smile CDR
  humanURL: https://smilercdr.healthpartnersplans.com/fhir-request-apps/swagger-ui/
  baseURL: https://smilercdr.healthpartnersplans.com/
  description: >-
    The Jefferson Health Plans (formerly Health Partners Plans) Patient Access FHIR API exposes adjudicated
    claims, encounter data from providers, formulary data, and certain clinical data to JHP members via
    third-party apps under the CMS Interoperability and Patient Access Final Rule (CMS-9115-F). The repository
    conforms to HL7 FHIR Release 4.0.1, is powered by Smile CDR, and uses OAuth 2.0 / OpenID Connect for
    member authentication and authorization, with developer registration handled through the JHP SMART
    on FHIR App Developer Portal.
  properties:
  - type: Documentation
    url: https://www.jeffersonhealthplans.com/home/about-us/interoperability/api-tools/
