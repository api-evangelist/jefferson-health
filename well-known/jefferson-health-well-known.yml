      - path: /smartauth-fhir/.well-known/smart-configuration
        status: 200
        real_document: false
        note: >-
          Returns the developer-portal HTML shell (<!DOCTYPE html>, Build 1.1.768.0),
          not a SMART configuration document. Soft-200 — treated as a miss.
      - path: /.well-known/agent-card.json
        status: 404
        real_document: false

  - host: providerfhirapi.healthpartnersplans.com
