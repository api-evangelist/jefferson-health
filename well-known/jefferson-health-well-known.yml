method: probed
source: live HTTP probes of every apis.yml baseURL host, OpenAPI servers[] host and web host
description: >-
  Well-known discovery surface for Jefferson Health. The organization serves no
  RFC 9116 security.txt and no /.well-known/api-catalog on any host. What it DOES
  serve — and what an agent can actually read anonymously — is the SMART on FHIR
  discovery set required by the CMS Interoperability and Patient Access Final Rule:
  a SMART configuration document and an OpenID Connect discovery document on the
  Thomas Jefferson University Hospital Epic FHIR proxy, and an OpenID Connect
  discovery document on the Jefferson Health Plans SMART authorization server.
  Those are real, parsed JSON documents, which is why the WellKnown pointer is
  emitted. Note the false positive recorded below: www.jeffersonhealth.org answers
  HTTP 200 for /.well-known/security.txt but returns an Adobe Experience Manager
  HTML/JS shell, not a security.txt — it is recorded as a MISS.

hosts:
  - host: fhir.jefferson.edu
    role: Thomas Jefferson University Hospital Epic FHIR proxy (TJUH FHIR R4/DSTU2)
    documents:
      - path: /FHIRProxy/api/FHIR/R4/.well-known/smart-configuration
        status: 200
        content_type: application/json
        real_document: true
        file: jefferson-health-tjuh-smart-configuration.json
        spec: SMART App Launch 2.x well-known/smart-configuration
      - path: /FHIRProxy/api/FHIR/R4/.well-known/openid-configuration
        status: 200
        content_type: application/json
        real_document: true
        file: jefferson-health-tjuh-openid-configuration.json
        spec: OpenID Connect Discovery 1.0
      - path: /.well-known/security.txt
        status: 403
        real_document: false
        note: 'Host root returns "Invalid Application, Access Denied" for every non-FHIRProxy path.'
      - path: /.well-known/openid-configuration
        status: 403
        real_document: false
      - path: /.well-known/oauth-authorization-server
        status: 403
        real_document: false
      - path: /.well-known/api-catalog
        status: 403
        real_document: false
      - path: /.well-known/ai-plugin.json
        status: 403
        real_document: false
      - path: /.well-known/agent-card.json
        status: 403
        real_document: false
      - path: /.well-known/agent.json
        status: 403
        real_document: false

  - host: appgallery.healthpartnersplans.com
