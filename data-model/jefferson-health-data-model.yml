    name: Clinical record (Thomas Jefferson University Hospital)
    server: tjuh-fhir-r4
    base_url: https://fhir.jefferson.edu/FHIRProxy/api/FHIR/R4
    profile_set: US Core 6.1.0
    root_entity: Patient
    entities_exposed: 59
