description: >-
  Entity-relationship graph for the two Jefferson Health FHIR surfaces. Unlike a
  bespoke REST API, the entity model here is not Jefferson's invention: it is
  HL7 FHIR R4 constrained by US Core 6.1.0 on the hospital side and Da Vinci
  PDEX Plan-Net 1.2.0 on the payer side. What IS provider-specific — and what is
  captured below — is which resources each server actually exposes and which
  reference traversals it will honour, both read directly out of the servers'
  own searchInclude/searchRevInclude declarations rather than inferred.

id_convention:
  style: fhir-logical-id
  format: '{ResourceType}/{id}'
  example_observed: Practitioner/8742377
  note: >-
    Ids are server-assigned opaque strings with no type prefix embedded in the
    id itself; the type lives in the path. Never construct one — resolve it
    from Bundle.entry[].fullUrl. Ids are NOT portable between the TJUH and JHP
    servers even for the same real-world practitioner.

domains:
