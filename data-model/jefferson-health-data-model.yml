  - id: provider-directory
    name: Provider directory (Jefferson Health Plans, Da Vinci Plan-Net)
    server: jhp-provider-directory
    base_url: https://providerfhirapi.healthpartnersplans.com
    profile_set: Da Vinci PDEX Plan-Net 1.2.0
    root_entity: Organization
    entities_exposed: 8

