cross_domain:
  - note: >-
      Patient (clinical) and Practitioner/Organization (provider directory) live
      on different servers with different id spaces and different auth. There is
      no reference between them and no shared identifier system published. An
      agent that wants "which Jefferson doctor wrote this MedicationRequest, and
      is that doctor in my network" must join on NPI or name across two
      unrelated FHIR endpoints.

gaps:
  - entity: OrganizationAffiliation
    issue: >-
      Served live by providerfhirapi.healthpartnersplans.com but absent from
      openapi/ and from apis.yml apis[]. The catalog under-describes the
      Provider Directory by one resource.
  - entity: 'TJUH clinical resources (49 of 59)'
    issue: >-
      The Epic CapabilityStatement exposes 59 resource types; the OpenAPI in
      openapi/_original/ describes 10 paths. Immunization, Procedure,
      DiagnosticReport, CarePlan, CareTeam, Goal, Coverage,
      ExplanationOfBenefit, ImagingStudy and 40 more are callable and
      undescribed. Harvesting them is a future round, not a fabrication for
      this one.

